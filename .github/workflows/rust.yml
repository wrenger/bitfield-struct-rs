name: Rust Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  build-syn2:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Adjust Cargo.lock
      run: cargo update --precise 2.0.108 syn@3
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
